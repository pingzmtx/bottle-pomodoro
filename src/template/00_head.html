<!-- 内容安全策略（纵深防御）。单文件全内联架构下 script/style 必须 'unsafe-inline'，
     本 CSP 的核心价值在【防数据外泄与外部执行面】而非阻止注入执行：
     connect-src 'self' 封死 XSS 后 fetch/XHR 外发；default-src 'self' 禁外部脚本/iframe；
     img-src 放行 https:（用户自定义远程皮肤图 + 网易云封面需要）；media-src 仅网易两域（音频 302 至 126.net CDN）；
     修复转义漏洞是第一道防线，本策略为第二道。 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https://music.163.com https://*.126.net; connect-src 'self' blob: data:; font-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'; worker-src 'self'">

<!-- PWA：加到主屏幕后独立窗口 + 离线可用。两个文件（manifest / sw.js）和 icons/
     只在托管版存在；本地 file:// 打开时这些链接 404 但不影响任何功能，
     注册代码会按协议判断跳过。 -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<!-- 字体预加载：让三个首屏字体在 HTML 解析阶段就开始下载，而不是等 CSS 下载完
     再解析出 @font-face 才发请求。省掉的是「CSS 往返 + 解析」这一段 —— 本地是
     几十毫秒看不出来，但在手机弱网下那一段本身就是一两秒，用户看到的就是
     「先黑体、过一会儿才变楷体」。
     · 必须带 crossorigin：字体请求是 CORS 模式，不写会二次下载（缓存键不同）。
     · 只预加载首屏真的要用的三个；WenKaiExtra（1.15 MB）绝不预加载 ——
       那是备用块，预加载它等于把拆块白做。
     · 用 as="font" type="font/woff2"，浏览器不支持 woff2 时会直接跳过。 -->
<link rel="preload" as="font" type="font/woff2" href="fonts/wenkai-regular.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="fonts/smiley-title.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="fonts/inter-latin.woff2" crossorigin>
