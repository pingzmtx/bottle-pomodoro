<!-- 启动画面：静态首元素。
     必须写在这里（body 第一个节点、主样式块之后），而不是由 JS 动态创建：
     index.html 单文件里 slot1~slot9 的内联脚本全排在正文之后，等 JS 跑到
     ensureBootSplash() 时，浏览器早已把 view-timer 渲染出来了 —— 用户先看到
     主页、几百毫秒后才被加载页盖住，也就是"眼前闪一下"。
     静态写死在首元素后，浏览器解析到这一行立刻绘制遮罩，首帧即"正在启动"。
     ★ 语录必须写死一份默认文案（JS 只在跑起来后随机换一句）：整页 3 MB，
       首次打开/清过缓存时下载要几十秒，这段 HTML 里的字是唯一还能显示的东西 ——
       留空的话用户看到的就是「一个番茄 + 一条进度条 + 下面什么都没有」，
       像是页面坏了。boot-hint 同理，纯 CSS 延时 6 秒淡入：加载快时它来不及
       出现（遮罩早被 JS 摘掉了），只有真慢的时候才需要有句话安抚。 -->
